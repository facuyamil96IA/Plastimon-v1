<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plastimon SYS — Ingresar</title>
<link rel="stylesheet" href="shared/plastimon.css">
<style>
  /* Estilos extra solo para la pantalla de login */
  #app { justify-content: center; padding: 40px 28px; min-height: 100vh; display: flex; flex-direction: column; }

  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 48px; }
  .login-brand svg { width: 280px; height: 54px; }
  .login-tagline { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #7A8A99; }

  .login-card {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 32px; padding: 32px 28px 36px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.10);
  }

  .login-card-title {
    font-size: 10px; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase;
    color: #7A8A99; margin-bottom: 28px; display: flex; align-items: center; gap: 8px;
  }
  .login-card-title::before { content:''; width:20px; height:2px; background:#F05A1A; display:inline-block; }

  .login-fields { display: flex; flex-direction: column; gap: 24px; margin-bottom: 28px; }
  .field-wrap { display: flex; flex-direction: column; gap: 6px; }

  .input-label { font-size: 9px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 6px; }
  .input-line {
    width: 100%; border: none; border-bottom: 2px solid #e2e8f0;
    padding: 8px 0; font-size: 15px; font-weight: 600; color: #050514;
    outline: none; background: transparent;
    font-family: system-ui, -apple-system, sans-serif;
    transition: border-bottom-color 0.2s;
  }
  .input-line:focus       { border-bottom-color: #00B8C4; }
  .input-line::placeholder { color: #cbd5e1; font-weight: 400; }

  .error-msg {
    background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.25);
    border-radius: 14px; padding: 12px 16px;
    font-size: 12px; font-weight: 700; color: #b91c1c;
    display: none; margin-bottom: 16px; align-items: center; gap: 8px;
  }
  .error-msg.show { display: flex; }

  .btn-login {
    background: #050514; color: #fff; border: none; border-radius: 16px;
    padding: 15px 24px; font-size: 13px; font-weight: 900;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    width: 100%; min-height: 54px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.2s;
  }
  .btn-login:disabled { opacity: 0.6; pointer-events: none; }
  .btn-login.loading .btn-text   { display: none; }
  .btn-login.loading .btn-loader { display: inline-block; }
  .btn-loader { display: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer { margin-top: 28px; text-align: center; font-size: 11px; color: #7A8A99; }
  .login-footer a { color: #00B8C4; font-weight: 700; text-decoration: none; }

  .version-tag {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(0,0,0,0.2); white-space: nowrap; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="login-brand">
    <svg viewBox="0 0 580 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>.bt{font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:54px;stroke:#050514;stroke-width:12px;stroke-linejoin:round;paint-order:stroke;letter-spacing:8px} .sys{font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:32px;fill:#050514;letter-spacing:2px}</style>
      </defs>
      <text x="36%" y="65" text-anchor="middle" class="bt">
        <tspan fill="#8B44A3">P</tspan><tspan fill="#00B8C4">L</tspan><tspan fill="#00B8C4">A</tspan>
        <tspan fill="#00B8C4">S</tspan><tspan fill="#00B8C4">T</tspan><tspan fill="#00B8C4" font-size="48">i</tspan>
        <tspan fill="#FFCC00">M</tspan><tspan fill="#FFCC00">O</tspan><tspan fill="#8B44A3">N</tspan>
      </text>
      <text x="495" y="60" class="sys">SYS</text>
    </svg>
    <span class="login-tagline">Sistema de gestión</span>
  </div>

  <div class="login-card">
    <div class="login-card-title">Ingresá a tu cuenta</div>

    <div class="error-msg" id="error-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
      </svg>
      <span id="error-text">Error al iniciar sesión</span>
    </div>

    <div class="login-fields">
      <div class="field-wrap">
        <label class="input-label" for="inp-email">Email</label>
        <input class="input-line" id="inp-email" type="email" placeholder="tu@email.com" autocomplete="email" inputmode="email" autofocus />
      </div>
      <div class="field-wrap">
        <label class="input-label" for="inp-password">Contraseña</label>
        <div style="position:relative;">
          <input class="input-line" id="inp-password" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:36px;" />
          <button id="btn-toggle" type="button" style="position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:#94a3b8;display:flex;align-items:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <button class="btn-login" id="btn-login" type="button">
      <span class="btn-text">Ingresar →</span>
      <span class="btn-loader spinner"></span>
    </button>
  </div>

  <div class="login-footer">
    ¿Problemas? <a href="https://wa.me/5493624027324" target="_blank">Contactar soporte</a>
  </div>
</div>

<div class="version-tag">Plastimon SYS · v1.0 · Dos Tercios Studio</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/db.js"></script>
<script src="shared/auth.js"></script>
<script>
  Auth.getSession().then(s => { if (s) window.location.href = 'index.html'; });

  document.getElementById('btn-toggle').addEventListener('click', () => {
    const inp = document.getElementById('inp-password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  async function doLogin() {
    const email    = document.getElementById('inp-email').value.trim();
    const password = document.getElementById('inp-password').value;
    const btn      = document.getElementById('btn-login');
    const errEl    = document.getElementById('error-msg');
    const errTxt   = document.getElementById('error-text');

    if (!email || !password) { errTxt.textContent='Completá email y contraseña.'; errEl.classList.add('show'); return; }

    btn.classList.add('loading'); btn.disabled = true; errEl.classList.remove('show');

    const {error} = await Auth.login(email, password);
    if (error) {
      errTxt.textContent = error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : error.message;
      errEl.classList.add('show'); btn.classList.remove('loading'); btn.disabled = false; return;
    }
    window.location.href = 'index.html';
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('inp-email').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('inp-password').focus(); });
  document.getElementById('inp-password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
</script>
</body>
</html>
